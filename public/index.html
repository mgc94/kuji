<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>행운의 뽑기</title><link rel="stylesheet" href="style.css"><script defer src="script.js"></script></head>
<body>
<header><a class="brand" href="./">✦ LUCKY DRAW</a><div class="tools"><button id="fullscreen">전체 화면</button><button id="reset">새 뽑기판</button></div></header>
<main>
<section class="intro"><span class="eyebrow">100장의 티켓, 나만의 행운</span><h1>오늘의 행운을<br>골라보세요<span>✦</span></h1><p>마음에 드는 티켓을 고르고, 쿠폰을 열어 확인하세요.</p></section>
<section class="prizes" id="prizes" aria-label="등수별 남은 수량"></section>
<section class="board-panel"><div class="board-head"><div><h2>티켓을 선택하세요</h2><p id="status" aria-live="polite">한 번에 한 장씩 뽑을 수 있어요.</p></div><span class="remaining"><b id="remaining">100</b> / 100장 남음</span></div><div class="board-scroll"><div id="board" class="board" aria-label="100장의 뽑기 티켓"></div></div><div class="actions"><button id="random" class="secondary">↻ 랜덤 선택</button><button id="start" class="primary" disabled>뽑기 시작 <span>→</span></button></div></section>
<section class="history-panel"><h2>최근 뽑기 결과</h2><div id="history" class="history"></div></section>
<footer>같은 기기·브라우저에 진행 상황이 저장됩니다. <span id="save-status"></span></footer>
</main>
<dialog id="draw-dialog"><div class="modal"><span class="eyebrow">YOUR LUCKY TICKET</span><h2 id="modal-title">어떤 행운이 기다릴까요?</h2><p id="modal-help">아래 쿠폰 열기 버튼을 눌러주세요.</p><div id="coupon" class="coupon"><span id="ticket-label"></span><strong id="result">?</strong><span id="result-message">당신의 행운을 열어보세요</span><div class="barcode"></div></div><button id="open" class="primary">쿠폰 열기 ✦</button><button id="close" class="secondary" hidden>다음 뽑기</button><p class="small">뽑기 시작 시 티켓이 확정됩니다.</p></div></dialog>
<dialog id="reset-dialog"><form method="dialog" class="modal"><h2>새 뽑기판을 시작할까요?</h2><p>지금까지의 결과를 지우고<br>100장의 티켓을 다시 섞습니다.</p><button value="cancel" class="secondary">취소</button><button id="confirm-reset" type="button" class="primary">초기화하고 시작</button></form></dialog>
</body></html>
